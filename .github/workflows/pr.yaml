  terraform:
    name: Terraform Environment
    runs-on: ubuntu-latest
    needs: [changed_files ,tests]
    permissions:
      pull-requests: write
    strategy:
      matrix:
        changed_files: ${{ fromJson(needs.changed_files.outputs.environments_changed_dir) }}
    steps:
      - name: Echo matrix
        run: echo ${{ matrix.changed_files }}

      - uses: actions/checkout@v4 # v4.2.2
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Setup env
        run: |
          tf_dir_path="${{ github.workspace }}/${{ matrix.changed_files }}"
          log_file_path="/tmp/$(basename $tf_dir_path).txt"

          echo "TF_DIR_PATH=$tf_dir_path" >> $GITHUB_ENV
          echo "LOG_FILE_PATH=$log_file_path" >> $GITHUB_ENV

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11"

      - name: Terraform Init
        working-directory: ${{ matrix.changed_files }}
        run: |
          terraform init -no-color -input=false

      - name: Terraform Plan
        working-directory: ${{ matrix.changed_files }}
        run: |
          terraform plan -no-color -input=false > tfplan.txt

      - name: Setup TF Plan
        working-directory: ${{ matrix.changed_files }}
        run: |
          echo "## Change detected in the following directories: \`${{ matrix.changed_files }}\` 🚀" >>  ${{ env.LOG_FILE_PATH }}
          # echo "#### Terraform Initialization ⚙️ ${{ steps.init.outcome }}" >>  ${{ env.LOG_FILE_PATH }}
          echo "#### Terraform Plan 📖 ${{ steps.plan.outcome }}" >>  ${{ env.LOG_FILE_PATH }}
          echo "\`\`\`hcl" >>  ${{ env.LOG_FILE_PATH }}
          echo "$(cat tfplan.txt)" >>  ${{ env.LOG_FILE_PATH }}
          echo "\`\`\`" >>  ${{ env.LOG_FILE_PATH }}
          echo "*Pushed by: @${{ github.actor }}, Action: ${{ github.event_name }}*" >>  ${{ env.LOG_FILE_PATH }}

      - name: Find PR comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        id: pr
        with:
          issue-number: ${{ github.event.number }}
          body-includes: "## Change detected in the following directories: ${{ matrix.changed_files }} 🚀"

      - name: Create PR comment
        if: steps.pr.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          issue-number: ${{ github.event.number }}
          body-path: ${{ env.LOG_FILE_PATH }}
          reactions: rocket

      - name: Update PR comment
        if: steps.pr.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          comment-id: ${{ steps.pr.outputs.comment-id }}
          body-path: ${{ env.LOG_FILE_PATH }}
          edit-mode: replace
          reactions: hooray