name: on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'modules/**/*.tf'
      - 'environments/**/*.tf'

jobs:
  changed_files:
    name: Detect changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4.2.2
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - id: changed_files
        name: Get Changed files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c #v46.0.5
        with:
          matrix: true
          dir_names: "true"
          files_yaml: |
            modules:
              - modules/**/*.tf
            environments:
              - environments/**/*.tf

      - name: List all changed files
        if: steps.changed_files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
        run: |
          for file in ${CHANGED_FILES}; do
            echo "File: $file"
          done
    outputs:
      all_changed_files: ${{ steps.changed_files.outputs.all_changed_files }}
      module_changed_dir: ${{ steps.changed_files.outputs.modules_all_changed_files }}
      environments_changed_dir: ${{ steps.changed_files.outputs.environments_all_changed_files }}

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: changed_files
    permissions:
      pull-requests: write
    strategy:
      matrix:
        changed_dir: ${{ fromJson(needs.changed_files.outputs.environments_changed_dir) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags
      - name: Trivy Scan
        id: scan
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5
        continue-on-error: true
        with:
          scan-type: config
          hide-progress: true
          ignore-unfixed: true
          # severity: 'CRITICAL,HIGH'
          exit-code: 1
          format: table
          scan-ref: ${{ matrix.changed_dir }}
          # tf-vars: terraform.tfvars
          output: trivy.txt

      - name: Report to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('trivy.txt', 'utf8');
            const output = `Trivy report:
            \`\`\`\n
            ${report.length > 0 ? report : 'No issues found'}
            \`\`\`

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
